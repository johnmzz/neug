name: C API Linux and Windows trial

on:
  push:
    branches:
      - ci/c-api-platform-trial

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  package:
    uses: ./.github/workflows/package.yml
    with:
      c_api_only: true
      platforms: linux-x86_64

  verify-windows:
    uses: ./.github/workflows/verify-artifacts.yml
    with:
      platforms: '["windows-x86_64"]'
      c_api_only: true
      verify_c_api: true
      verify_java: false
      c_api_run_id: '44272900006'

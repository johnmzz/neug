name: C API Linux and Windows trial

on:
  push:
    branches:
      - ci/c-api-platform-trial

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  package:
    uses: ./.github/workflows/package.yml
    with:
      c_api_only: true
      platforms: linux-x86_64,windows-x86_64
